[project]
name = "newnews"
version = "0.1.0"
description = "Private commute news podcast feed built from public podcast RSS feeds (links only, no audio re-hosting)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "feedgen>=1.0",
]
# HINT: add runtime deps with `uv add <pkg>`; never `pip install` into the venv by hand.

[project.scripts]
commute-news = "commute_news.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commute_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# HINT: tests must never touch the network; use files in tests/fixtures/.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
