[project]
name = "newnews"
version = "0.1.0"
description = "Private commute news podcast feed built from public podcast RSS feeds (links only, no audio re-hosting)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nick L" }]
keywords = ["podcast", "rss", "news", "feed", "overcast", "macos", "commute"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Sound/Audio",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
]
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "feedgen>=1.0",
]
# HINT: add runtime deps with `uv add <pkg>`; never `pip install` into the venv by hand.

[project.scripts]
commute-news = "commute_news.cli:main"

[project.urls]
Homepage = "https://github.com/nbleak21/NewNews"
Repository = "https://github.com/nbleak21/NewNews"
Issues = "https://github.com/nbleak21/NewNews/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commute_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# HINT: tests must never touch the network; use files in tests/fixtures/.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
